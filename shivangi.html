<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Girlfriend ❤️</title>

<style>
    body{
        margin:0;
        padding:0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff9a9e, #fad0c4);
        display:flex;
        justify-content:center;
        align-items:center;
        height:100vh;
    }

    .card{
        background:white;
        padding:40px;
        border-radius:20px;
        text-align:center;
        box-shadow:0 10px 25px rgba(0,0,0,0.2);
        max-width:500px;
    }

    h1{
        color:#ff4d6d;
        font-size:40px;
    }

    p{
        font-size:20px;
        color:#555;
        line-height:1.6;
    }

    .heart{
        font-size:60px;
        animation: beat 1s infinite;
    }

    @keyframes beat{
        0%{transform:scale(1);}
        50%{transform:scale(1.2);}
        100%{transform:scale(1);}
    }
</style>
</head>
<body>

<div class="card">
    <div class="heart">❤️</div>
    <h1>I Love You</h1>
    <p>
        You are very special to me.<br>
        Your snaps always make my day better. 😊<br><br>
        Please send me snaps regularly when you can.<br>
        Thinking of you always! please madam jii  ❤️
    </p>
</div>

</body>
</html>
